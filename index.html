<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funil BioMovement</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f172a; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 24px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 20px; }
        .search { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 8px; 
            background: #1e293b; 
            border: 1px solid #334155;
            color: #e2e8f0;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #16a34a;
            font-size: 13px;
        }
        .stat-num { font-size: 20px; font-weight: 700; margin: 4px 0; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .deals { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .card {
            background: #1e293b;
            padding: 14px;
            border-radius: 6px;
            border-left: 3px solid #16a34a;
            font-size: 12px;
        }
        .card-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .card-local { color: #94a3b8; font-size: 11px; margin-bottom: 8px; }
        .card-info { color: #4ade80; font-size: 11px; margin: 2px 0; }
        .card-status { 
            width: 100%; 
            padding: 6px; 
            border-radius: 4px; 
            background: #0f172a; 
            color: #e2e8f0; 
            font-size: 11px; 
            border: 1px solid #334155; 
            cursor: pointer; 
            margin-top: 8px;
        }
        .empty { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 FUNIL BIOMOVEMENT</h1>
        <input type="text" class="search" id="search" placeholder="Buscar empresa, município ou contato...">
        <div class="stats" id="stats"></div>
        <div class="deals" id="deals"><div class="empty">Carregando...</div></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bztlrboznicyboaqpnft.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6dGxyYm96bmpjeWJvcXBuZmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzQ2NDYsImV4cCI6MjA5NDkxMDY0Nn0.AMvddsMytZ-bVRD72h8UzynC0rKl7GFbIoHxSiIb7Bk';

        const STATUSES = [
            { id: 'assinado', label: '✅ Assinado', color: '#16a34a' },
            { id: 'fechamento', label: '🟡 Fechamento', color: '#ca8a04' },
            { id: 'franqueado', label: '🤝 Franqueado', color: '#2563eb' },
            { id: 'conversando', label: '💬 Conversando', color: '#9333ea' },
            { id: 'follow', label: '📞 Follow', color: '#dc2626' },
            { id: 'decreto', label: '📍 Decreto', color: '#ea580c' }
        ];

        let allDeals = [];

        async function loadDeals() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/deals?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                allDeals = await response.json();
                console.log(`Loaded ${allDeals.length} deals`);
                render();
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('deals').innerHTML = '<div class="empty">❌ Erro ao carregar</div>';
            }
        }

        function filterDeals() {
            const query = document.getElementById('search').value.toLowerCase();
            return allDeals.filter(d => {
                const text = `${d.empresa} ${d.local} ${d.contato || ''} ${d.acao || ''}`.toLowerCase();
                return text.includes(query);
            });
        }

        function render() {
            const filtered = filterDeals();
            let statsHtml = '';
            STATUSES.forEach(status => {
                const items = filtered.filter(d => d.status === status.id);
                const mrr = items.reduce((a, d) => a + (d.mrr || 0), 0);
                const esc = items.reduce((a, d) => a + (d.escolas || d.escolas_municipais || 0), 0);
                statsHtml += `<div class="stat" style="border-left-color: ${status.color}"><div class="stat-label">${status.label}</div><div class="stat-num">${items.length}</div>${esc > 0 || mrr > 0 ? `<div class="stat-label">${esc > 0 ? esc + ' esc' : ''} ${mrr > 0 ? 'R$' + (mrr/1000).toFixed(1) + 'k' : ''}</div>` : ''}</div>`;
            });
            document.getElementById('stats').innerHTML = statsHtml;

            if (filtered.length === 0) {
                document.getElementById('deals').innerHTML = '<div class="empty">Nenhum deal encontrado</div>';
                return;
            }

            const dealsHtml = filtered.map(deal => {
                const status = STATUSES.find(s => s.id === deal.status);
                return `<div class="card" style="border-left-color: ${status.color}"><div class="card-title">${deal.empresa}</div><div class="card-local">${deal.local}</div>${deal.escolas_municipais ? `<div class="card-info">🏫 ${deal.escolas_municipais} municipais</div>` : ''}${deal.escolas ? `<div class="card-info">📍 ${deal.escolas} escolas</div>` : ''}${deal.mrr ? `<div class="card-info">💰 R$ ${deal.mrr.toLocaleString('pt-BR')}/mês</div>` : ''}${deal.contato ? `<div style="color: #94a3b8; margin-top: 6px;">👤 ${deal.contato}</div>` : ''}${deal.acao ? `<div style="color: #cbd5e1; margin-top: 4px;">→ ${deal.acao}</div>` : ''}<select class="card-status" onchange="changeStatus('${deal.id}', this.value)">${STATUSES.map(s => `<option value="${s.id}" ${s.id === deal.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>`;
            }).join('');
            document.getElementById('deals').innerHTML = dealsHtml;
        }

        async function changeStatus(id, newStatus) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/deals?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                loadDeals();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        document.getElementById('search').addEventListener('input', render);
        loadDeals();
        setInterval(loadDeals, 5000);
    </script>
</body>
</html>
